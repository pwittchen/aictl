name: RELEASE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml, Cargo.lock, and website version if needed
        run: |
          # Workspace `version` lives under [workspace.package] in the root
          # Cargo.toml; both crates inherit it via `version.workspace = true`.
          # Flag-based section parsing (not an awk range) — `[workspace.package]`
          # is the last section in Cargo.toml, so a `addr1,addr2` range where
          # both addresses match `^\[` collapses to a single line.
          current=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            in_section && /^\[/ { in_section=0 }
            in_section && /^version *= *"/ {
              sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit
            }
          ' Cargo.toml)
          tag_version="${{ steps.version.outputs.version }}"
          changed=0
          if [ "$current" != "$tag_version" ]; then
            # Bump the single source of truth at the workspace root.
            awk -v new="$tag_version" '
              /^\[workspace\.package\]/ { in_section=1; print; next }
              in_section && /^\[/ { in_section=0 }
              in_section && /^version *= *"/ { print "version = \"" new "\""; next }
              { print }
            ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
            # Cargo.lock has one entry per workspace member.
            sed -i '/^name = "aictl-cli"$/{n;s/^version = ".*"$/version = "'"$tag_version"'"/;}' Cargo.lock
            sed -i '/^name = "aictl-core"$/{n;s/^version = ".*"$/version = "'"$tag_version"'"/;}' Cargo.lock
            sed -i '/^name = "aictl-server"$/{n;s/^version = ".*"$/version = "'"$tag_version"'"/;}' Cargo.lock
            sed -i '/^name = "aictl-desktop"$/{n;s/^version = ".*"$/version = "'"$tag_version"'"/;}' Cargo.lock
            # Tauri reads its own `version` field from tauri.conf.json — that
            # value drives the bundle identifier and the DMG file name.
            sed -i 's/^\(  "version": "\)[0-9][0-9.]*"/\1'"$tag_version"'"/' crates/aictl-desktop/tauri.conf.json
            sed -i 's/^\(  "version": "\)[0-9][0-9.]*"/\1'"$tag_version"'"/' crates/aictl-desktop/webview/package.json
            changed=1
          fi
          if ! grep -q "v$tag_version ·" website/index.html; then
            sed -i "s/v[0-9][0-9.]*\( ·[^<]*<\/div>\)/v$tag_version\1/" website/index.html
            changed=1
          fi
          if ! grep -q "v$tag_version ·" website/terminal.html; then
            sed -i "s/v[0-9][0-9.]*\( ·[^<]*<\/div>\)/v$tag_version\1/" website/terminal.html
            changed=1
          fi
          if ! grep -q "v$tag_version ·" website/server.html; then
            sed -i "s/v[0-9][0-9.]*\( ·[^<]*<\/div>\)/v$tag_version\1/" website/server.html
            changed=1
          fi
          # /healthz response example carries its own JSON `"version": "X.Y.Z"`
          # literal — bump it too so the docs match what the server returns.
          if ! grep -q "\"version\"</span><span class=\"tok-p\">:</span> <span class=\"tok-s\">\"$tag_version\"" website/server.html; then
            sed -i "s|\(\"version\"</span><span class=\"tok-p\">:</span> <span class=\"tok-s\">\)\"[0-9][0-9.]*\"|\1\"$tag_version\"|" website/server.html
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock website/index.html website/terminal.html website/server.html crates/aictl-desktop/tauri.conf.json crates/aictl-desktop/webview/package.json
            git commit -m "Bump version to $tag_version"
            git push origin HEAD:master
          fi

  build:
    needs: version-bump
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aictl-linux-x86_64
            server_artifact: aictl-server-linux-x86_64
            features: gguf redaction-ner
            server_features: redaction-ner
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: aictl-linux-aarch64
            server_artifact: aictl-server-linux-aarch64
            features: gguf redaction-ner
            server_features: redaction-ner
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: aictl-darwin-x86_64
            server_artifact: aictl-server-darwin-x86_64
            features: gguf redaction-ner
            server_features: redaction-ner
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: aictl-darwin-aarch64
            server_artifact: aictl-server-darwin-aarch64
            features: gguf mlx redaction-ner
            server_features: redaction-ner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config cmake build-essential

      - name: Install macOS dependencies
        if: contains(matrix.os, 'macos')
        run: brew install cmake

      - name: Select Xcode 16.4
        if: matrix.target == 'aarch64-apple-darwin'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}-${{ matrix.server_features }}

      - name: Build aictl (CLI)
        run: cargo build --release -p aictl-cli --features "${{ matrix.features }}" --target ${{ matrix.target }}

      - name: Build aictl-server
        # Server is the LLM proxy — no inference (`gguf` / `mlx`) needed,
        # so it ships much smaller than the CLI. `redaction-ner` is kept
        # because the server applies the same outbound redaction on the
        # proxy path that the CLI does at the network boundary.
        run: cargo build --release -p aictl-server --features "${{ matrix.server_features }}" --target ${{ matrix.target }}

      - name: Package aictl (CLI)
        shell: bash
        run: |
          bin_src="target/${{ matrix.target }}/release/aictl"
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            # MLX bakes an absolute METAL_PATH into the binary at compile time
            # pointing to the CI runner's build dir. That path vanishes when the
            # runner exits, so we ship mlx.metallib next to the binary — MLX's
            # first runtime fallback is <exec_dir>/mlx.metallib.
            metallib=$(find "target/${{ matrix.target }}/release/build" -type f -name mlx.metallib -print -quit)
            if [ -z "$metallib" ]; then
              echo "ERROR: mlx.metallib not found in build output"
              find "target/${{ matrix.target }}/release/build" -type d -name kernels
              exit 1
            fi
            stage=$(mktemp -d)
            cp "$bin_src" "$stage/aictl"
            cp "$metallib" "$stage/mlx.metallib"
            tar -C "$stage" -czf "${{ matrix.artifact }}.tar.gz" aictl mlx.metallib
            echo "asset=${{ matrix.artifact }}.tar.gz" >> "$GITHUB_ENV"
          else
            cp "$bin_src" "${{ matrix.artifact }}"
            echo "asset=${{ matrix.artifact }}" >> "$GITHUB_ENV"
          fi

      - name: Package aictl-server
        shell: bash
        run: |
          bin_src="target/${{ matrix.target }}/release/aictl-server"
          cp "$bin_src" "${{ matrix.server_artifact }}"
          echo "server_asset=${{ matrix.server_artifact }}" >> "$GITHUB_ENV"

      - name: Upload aictl artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.asset }}

      - name: Upload aictl-server artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.server_artifact }}
          path: ${{ env.server_asset }}

  build-desktop:
    needs: version-bump
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: aictl-desktop-darwin-x86_64
            features: gguf redaction-ner
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: aictl-desktop-darwin-aarch64
            features: gguf mlx redaction-ner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install macOS dependencies
        run: brew install cmake

      - name: Select Xcode 16.4
        if: matrix.target == 'aarch64-apple-darwin'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache rejects commas in keys, so `matrix.features` is
          # space-separated (matches the CLI build job above). Cargo and
          # Tauri CLI accept either form for `--features`.
          key: desktop-${{ matrix.target }}-${{ matrix.features }}
          workspaces: ". -> target"

      - name: Install webview deps
        working-directory: crates/aictl-desktop/webview
        run: npm install

      - name: Install Tauri CLI
        # Pinned to the v2 line — matches `tauri = "2"` in
        # crates/aictl-desktop/Cargo.toml.
        run: npm install -g @tauri-apps/cli@^2

      - name: Build desktop app (.app)
        # `--bundles app` overrides `bundle.targets: ["app", "dmg"]` in
        # tauri.conf.json — we need the .app on its own so we can inject
        # mlx.metallib into Contents/MacOS/ before the DMG is sealed (see
        # the next step). The before-build hook in the same conf still
        # shells out to `npm run build` to populate webview/dist.
        # `--features` mirrors the CLI matrix so the desktop ships with
        # the same engine capabilities (gguf / mlx / redaction-ner).
        working-directory: crates/aictl-desktop
        run: tauri build --target ${{ matrix.target }} --features "${{ matrix.features }}" --bundles app

      - name: Inject mlx.metallib into .app
        # Same fix-up as the CLI tarball on aarch64: MLX bakes an
        # absolute METAL_PATH that vanishes when the runner exits, so
        # ship `mlx.metallib` next to the binary inside the bundle —
        # MLX's first runtime fallback is `<exec_dir>/mlx.metallib`,
        # which on macOS resolves to `Contents/MacOS/`.
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          metallib=$(find "target/${{ matrix.target }}/release/build" -type f -name mlx.metallib -print -quit)
          if [ -z "$metallib" ]; then
            echo "ERROR: mlx.metallib not found in build output"
            find "target/${{ matrix.target }}/release/build" -type d -name kernels
            exit 1
          fi
          app_dir=$(find "target/${{ matrix.target }}/release/bundle/macos" -type d -name "*.app" -print -quit)
          if [ -z "$app_dir" ]; then
            echo "ERROR: .app not produced"
            exit 1
          fi
          cp "$metallib" "$app_dir/Contents/MacOS/mlx.metallib"

      - name: Import Developer ID certificate
        # Imports the .p12 (base64-encoded in MACOS_CERTIFICATE) into a
        # one-shot keychain scoped to this job. The "Clean up keychain"
        # step at the end of the job (always()) removes it. Token paths
        # follow GitHub's recommended pattern — see
        # https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[" ]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign .app with Developer ID
        # Hardened runtime + entitlements (allow-jit etc., needed by
        # WKWebView) + secure timestamp — all required for Apple to
        # accept the bundle for notarization.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          app_dir=$(find "target/${{ matrix.target }}/release/bundle/macos" -type d -name "*.app" -print -quit)
          if [ -z "$app_dir" ]; then
            echo "ERROR: .app not produced"
            exit 1
          fi
          codesign --force --deep \
            --options runtime \
            --entitlements crates/aictl-desktop/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"

      - name: Notarize and staple .app
        # notarytool needs zip/dmg/pkg, so ditto the .app into a zip
        # for submission. `--wait` blocks until Apple either accepts
        # or rejects (typically <5 min). On success, stapler embeds
        # the ticket so Gatekeeper accepts the .app offline.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          app_dir=$(find "target/${{ matrix.target }}/release/bundle/macos" -type d -name "*.app" -print -quit)
          zip_path="$RUNNER_TEMP/aictl-notarize.zip"
          /usr/bin/ditto -c -k --keepParent "$app_dir" "$zip_path"
          xcrun notarytool submit "$zip_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app_dir"
          xcrun stapler validate "$app_dir"

      - name: Package updater archive (.app.tar.gz + .sig)
        # tauri-plugin-updater downloads a tarball of the .app, verifies
        # its minisign signature, then extracts in place over the
        # currently-running bundle. We tarball the *post-notarize* .app
        # (so the unwrapped bundle keeps Apple's codesign + stapled
        # ticket) and then sign the tarball with the Tauri updater key.
        # Done before the DMG step on purpose — that step removes the
        # release/ tree to free disk for hdiutil.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo "       Generate one with 'tauri signer generate' and add it to the repo secrets."
            echo "       See crates/aictl-desktop/README.md (Updater signing key)."
            exit 1
          fi
          app_dir=$(find "target/${{ matrix.target }}/release/bundle/macos" -type d -name "*.app" -print -quit)
          if [ -z "$app_dir" ]; then
            echo "ERROR: .app not produced"
            exit 1
          fi
          archive_name="${{ matrix.artifact }}.app.tar.gz"
          # Tar from the parent dir so the archive root is `aictl.app/`
          # rather than the GitHub-runner-specific absolute path.
          tar -C "$(dirname "$app_dir")" -czf "$archive_name" "$(basename "$app_dir")"
          tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$archive_name"
          ls -la "$archive_name" "$archive_name.sig"
          echo "updater_archive=$archive_name" >> "$GITHUB_ENV"
          echo "updater_signature=$archive_name.sig" >> "$GITHUB_ENV"

      - name: Package DMG
        # Tauri's own DMG bundler runs before the metallib injection
        # step above, so we build the DMG manually with hdiutil to
        # capture the patched .app. No DMG customization (background
        # image, icon positions) is configured in tauri.conf.json, so
        # this matches what Tauri would have produced — just resealed.
        shell: bash
        run: |
          app_dir=$(find "target/${{ matrix.target }}/release/bundle/macos" -type d -name "*.app" -print -quit)
          if [ -z "$app_dir" ]; then
            echo "ERROR: .app not produced"
            find "target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null || true
            exit 1
          fi
          staging=$(mktemp -d)
          cp -R "$app_dir" "$staging/"
          ln -s /Applications "$staging/Applications"
          # Free disk before hdiutil — the aarch64 runner has ~14 GB free and
          # the bundled .app (binary + ~280 MB mlx.metallib) plus hdiutil's
          # temporary sparse volume + final UDZO need ~1.5 GB of headroom.
          # The staged copy is self-contained, so the original target/ tree
          # is no longer needed for the rest of this job.
          df -h .
          rm -rf "target/${{ matrix.target }}/release"
          df -h .
          # `hdiutil create` flakes with "Resource busy" on GitHub
          # macOS runners — Spotlight indexing the staging dir, or a
          # leftover mount from a prior step. Retry with a defensive
          # detach between attempts.
          for attempt in 1 2 3; do
            hdiutil detach "/Volumes/aictl" -force 2>/dev/null || true
            if hdiutil create -volname "aictl" -srcfolder "$staging" -ov -format UDZO "${{ matrix.artifact }}.dmg"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: hdiutil create failed after 3 attempts"
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt), retrying in 5s..."
            sleep 5
          done
          echo "asset=${{ matrix.artifact }}.dmg" >> "$GITHUB_ENV"

      - name: Sign DMG with Developer ID
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "${{ matrix.artifact }}.dmg"
          codesign --verify --verbose=2 "${{ matrix.artifact }}.dmg"

      - name: Notarize and staple DMG
        # Stapling the DMG too (in addition to the .app inside) means
        # Gatekeeper accepts the download even before the user copies
        # the .app to /Applications, and gives a cleaner first-open UX.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          xcrun notarytool submit "${{ matrix.artifact }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${{ matrix.artifact }}.dmg"
          xcrun stapler validate "${{ matrix.artifact }}.dmg"

      - name: Clean up keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/devid.p12"

      - name: Upload aictl-desktop DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.asset }}

      - name: Upload updater archive artifact
        # Two separate artifacts: the tarball that the updater plugin
        # actually downloads, and the .sig file that the release job
        # consumes when assembling latest.json. Distinct artifact names
        # so `download-artifact ... merge-multiple` flattens them
        # cleanly into the same dir.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-updater
          path: |
            ${{ env.updater_archive }}
            ${{ env.updater_signature }}

  release:
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          previous_tag=$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')
          if [ -n "$previous_tag" ]; then
            log=$(git log --pretty=format:'- %s (%h)' "$previous_tag".."$GITHUB_REF_NAME" -- | grep -viE '^- (Bump version to|[Uu]pdate (ISSUES|README|CLAUDE|CHANGELOG)\.md)')
          else
            log=$(git log --pretty=format:'- %s (%h)' "$GITHUB_REF_NAME" -- | grep -viE '^- (Bump version to|[Uu]pdate (ISSUES|README|CLAUDE|CHANGELOG)\.md)')
          fi
          {
            echo 'body<<EOF'
            echo "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest (latest.json)
        # tauri-plugin-updater fetches this JSON, picks the entry that
        # matches the running build's `<os>-<arch>` (e.g.
        # `darwin-aarch64`), downloads the URL there, verifies the
        # signature against the pubkey baked into tauri.conf.json, and
        # extracts the .app.tar.gz over the existing bundle.
        # The endpoint configured in the app is
        #   https://github.com/<owner>/<repo>/releases/latest/download/latest.json
        # so this asset must be named exactly latest.json.
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          sig_x86=$(cat artifacts/aictl-desktop-darwin-x86_64.app.tar.gz.sig)
          sig_arm=$(cat artifacts/aictl-desktop-darwin-aarch64.app.tar.gz.sig)
          # `jq -n` so embedded newlines / quotes in the .sig payloads
          # are escaped properly. The plugin parses this with serde, so
          # malformed JSON would silently disable the updater.
          jq -n \
            --arg v "$version" \
            --arg date "$pub_date" \
            --arg notes "Release $GITHUB_REF_NAME — see https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME" \
            --arg sig_x86 "$sig_x86" \
            --arg sig_arm "$sig_arm" \
            --arg url_x86 "$base/aictl-desktop-darwin-x86_64.app.tar.gz" \
            --arg url_arm "$base/aictl-desktop-darwin-aarch64.app.tar.gz" \
            '{
              version: $v,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-x86_64": { signature: $sig_x86, url: $url_x86 },
                "darwin-aarch64": { signature: $sig_arm, url: $url_arm }
              }
            }' > artifacts/latest.json
          cat artifacts/latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          files: artifacts/*

  deploy-website:
    needs: release
    uses: ./.github/workflows/deploy-website.yml
    secrets: inherit
